name: Build and Release Tinker

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release icons from app-icon.png
        run: npm run tauri icon src/app-icon.png

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: Tinker v__VERSION__
          releaseBody: |
            ## Tinker 0.2.1

            A bugfix release focused on dependency management, player-data tooling, Modrinth compatibility, and the desktop experience.

            - Removed the redundant “Already installed” button.
            - Manual Modrinth links are saved on the Crafty server and follow the server to other computers.
            - Mod installs and updates select an actually compatible Modrinth version for the detected Minecraft version/loader instead of trusting the project-global latest version.
            - Added round tab icons and a Players tab marked clearly as work in progress.
            - Added a structured Configuration editor with toggles, numeric controls, and an advanced raw editor.
            - Configuration now hides mods without recognized config files and shows a strong warning explaining why.
            - Released Windows builds no longer open an extra terminal window.
            - Added a first-class dependency list in Explorer and Browse Mods.
            - Added a player-data menu that opens the actual server player-data file as a local NBT Explorer copy.
            - Fixed Modrinth descriptions, external links, and Minecraft-version filtering.
            - Fixed the Configuration wrench and app branding icons.
            - Added the Tauri signed updater pipeline.
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
