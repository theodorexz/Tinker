name: Build and Release Tinker

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-26
            args: --target aarch64-apple-darwin --bundles dmg
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-26' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release icons from app-icon.png
        run: npm run tauri icon src/app-icon.png

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: Tinker v__VERSION__
          releaseBody: |
            ## Tinker 0.2.10

            A cross-platform team-management and reliability release.

            - First-time shared Tinker account setup, with salted PBKDF2 password hashes and an administrator user-management screen.
            - Per-user permissions for installing/updating/deleting mods, editing server/mod config, controlling the server, running commands, exporting world files, managing users, and viewing audit history.
            - Shared audit history, per-mod “Added by” attribution, and optional Minecraft profile avatars.
            - Per-account dark/light/system appearance preferences that can sync between devices, with local-only preferences available.
            - Added a Terminal tab with command templates/autocomplete, server start/stop controls, and audit logging.
            - Added a World Map utility tab with dimension/region selectors, .mca export, and an MCA Selector release link.
            - Added NBTExplorer and MCA Selector links to Settings.
            - Replaced the web-only ZIP deflate assumption with a native Rust DEFLATE fallback for macOS WebKit.
            - Added a native Apple Silicon macOS 26 DMG build, alongside Windows NSIS and Linux AppImage/DEB artifacts.
            - Mod descriptions retain locally rendered Markdown; external sites that block iframes must not be embedded.
            - Existing Modrinth dependency filtering, server-side manual links, configuration editor, and player-data sync remain available.
            - macOS releases use ad-hoc signing; Gatekeeper may still require users to approve the app in Privacy & Security.
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          # The app updater currently targets Windows; don't let parallel macOS/Linux jobs overwrite latest.json.
          uploadUpdaterJson: ${{ matrix.name == 'Windows' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
