[package]
name = "ore-and-jar"
version = "0.1.0"
description = "Ore & Jar — a fast Minecraft mod manager for Crafty Controller"
authors = ["Ore & Jar"]
edition = "2021"

[lib]
name = "ore_and_jar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
base64 = "0.22"
